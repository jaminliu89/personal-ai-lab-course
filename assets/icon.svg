<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17202b"/>
      <stop offset="100%" style="stop-color:#0b0d10"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 电路风格的 AI 抽象图形 -->
  <g transform="translate(128,128)" stroke="#d9ff63" stroke-width="6" fill="none" stroke-linecap="round">
    <!-- 大脑/神经元抽象 -->
    <circle cx="128" cy="128" r="20" fill="#d9ff63"/>
    <circle cx="60" cy="70" r="12" fill="#d9ff63"/>
    <circle cx="196" cy="70" r="12" fill="#d9ff63"/>
    <circle cx="60" cy="186" r="12" fill="#d9ff63"/>
    <circle cx="196" cy="186" r="12" fill="#d9ff63"/>
    <!-- 连接线 -->
    <line x1="128" y1="108" x2="60" y2="82"/>
    <line x1="128" y1="108" x2="196" y2="82"/>
    <line x1="128" y1="148" x2="60" y2="174"/>
    <line x1="128" y1="148" x2="196" y2="174"/>
    <line x1="60" y1="82" x2="60" y2="174"/>
    <line x1="196" y1="82" x2="196" y2="174"/>
    <!-- 外圈节点 -->
    <circle cx="128" cy="20" r="8" fill="#9fe1ff" stroke="#9fe1ff"/>
    <circle cx="236" cy="128" r="8" fill="#9fe1ff" stroke="#9fe1ff"/>
    <circle cx="20" cy="128" r="8" fill="#9fe1ff" stroke="#9fe1ff"/>
    <circle cx="128" cy="236" r="8" fill="#9fe1ff" stroke="#9fe1ff"/>
    <line x1="128" y1="20" x2="128" y2="58" stroke="#9fe1ff"/>
    <line x1="236" y1="128" x2="208" y2="128" stroke="#9fe1ff"/>
    <line x1="20" y1="128" x2="48" y2="128" stroke="#9fe1ff"/>
    <line x1="128" y1="236" x2="128" y2="198" stroke="#9fe1ff"/>
  </g>
  <!-- 文字 -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="4" fill="#eef2f6">AI LAB</text>
</svg>
